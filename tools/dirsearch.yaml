name: "dirsearch"
command: "dirsearch"
enabled: true
short_description: "目录、文件和扩展名枚举首选；有界补齐爬取/JS 未覆盖的路径，支持 catch-all 过滤"
description: |
  Dirsearch 用于 Web 目录、文件和扩展名枚举；参数、虚拟主机和自定义请求模糊测试优先使用 ffuf。

  **触发与复用：**
  - 在任务包含 Web 攻击面发现时，爬取/JS 之外的未链接路径尚未覆盖，或发现需要继续枚举的目录，就执行有界目录发现；仅爬取/JS 提取不能替代这项覆盖
  - 相同 origin（协议/主机/端口）、路径范围、认证态和字典/扩展名已有充分且仍有效的扫描证据时可复用，包括 ffuf 的等价目录扫描；引用执行记录，不为调用次数重复扫描
  - 缺工具、网络或策略限制记录 blocked 与原始原因；不适用必须有范围或能力证据，不能只说已有很多接口

  **执行纪律：**
  - 先对同一认证态的 2–3 个随机不存在路径建立 catch-all（不存在路径也返回统一页面）基线，比较状态、长度、正文特征与重定向
  - 默认 20 线程、最多 50 请求/秒、单请求超时 30 秒、单次扫描最多 900 秒。经代理访问时不要把单请求超时降到 30 秒以下，也不要把总时限改短。首个 Request timeout 只说明这一跳慢或被断开，不能把整轮当成已完成。用户更严预算优先。429、持续挑战或健康异常时停止该轮，记录剩余范围
  - 优先经确认存在的小字典和技术栈相关扩展名；省略 wordlist 使用 dirsearch 自带字典，仍受时间/速率预算约束。extensions 默认只替换字典中的 %EXT%；小字典无占位符且确需补扩展名时才开启 force_extensions
  - 默认不递归；已确认目录需要补枚举时才开启 recursive，并设置 max_recursion_depth（默认 2）；不无界递归
  - 稳定统一页按实测 exclude_sizes、exclude_text、exclude_regex 或 exclude_response 过滤；exclude_response 填已验证随机不存在页面的站内路径，不是本地文件。不要猜过滤值，不一概排除 401/403/405/500，不用统一页面批量否定真实 JS/API
  - 保存实际字典/扩展名、基线、过滤条件、预算、停止原因、结果与执行引用。完成所选候选集且零新增才是该范围负结果；超时/限流/中断未完成必须保留 gap/blocked，不能写全覆盖
parameters:
  - name: "url"
    type: "string"
    description: "范围内目标 URL 或已确认需要继续枚举的目录 URL；不使用 FUZZ 占位符"
    required: true
    flag: "-u"
    format: "flag"
  - name: "extensions"
    type: "string"
    description: "文件扩展名（逗号分隔），优先按技术栈缩小；默认仅替换字典中的 %EXT%，不是自动给每个条目追加扩展名"
    required: false
    flag: "-e"
    format: "flag"
    default: "php,html,js,txt,xml,json"
  - name: "force_extensions"
    type: "bool"
    description: "给每个字典条目追加 extensions；仅在小字典无 %EXT% 且确需扩展名枚举时开启，会扩大候选集"
    required: false
    flag: "--force-extensions"
    format: "flag"
    default: false
  - name: "wordlist"
    type: "string"
    description: "单个真实存在的字典文件路径，优先小字典；省略时使用 dirsearch 自带字典，不猜安装路径"
    required: false
    existing_file: true
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "并发线程数；默认 20，目标限流或用户预算更严时降低"
    required: false
    minimum: 1
    flag: "-t"
    format: "flag"
    default: 20
  - name: "rate_limit"
    type: "int"
    description: "每秒最大请求数；默认 50，必须为正数，用户更严预算优先"
    required: false
    minimum: 1
    flag: "--max-rate"
    format: "flag"
    default: 50
  - name: "timeout"
    type: "int"
    description: "单请求超时（秒）；默认 30。经代理访问源站时不要低于 30，否则首包超时会让整轮扫描提前结束"
    required: false
    minimum: 1
    flag: "--timeout"
    format: "flag"
    default: 30
  - name: "max_time"
    type: "int"
    description: "单次扫描总时限（秒）；默认 900，必须为正数；不要自行改短。到时未完成的候选集保留 gap/blocked"
    required: false
    minimum: 1
    flag: "--max-time"
    format: "flag"
    default: 900
  - name: "recursive"
    type: "bool"
    description: "对已确认需要补枚举的目录启用递归；配合 max_recursion_depth 与 max_time 限制范围"
    required: false
    flag: "-r"
    format: "flag"
    default: false
  - name: "max_recursion_depth"
    type: "int"
    description: "启用递归时的最大深度；默认 2，必须为正数，不能传 0 开启无限深度"
    required: false
    minimum: 1
    flag: "--max-recursion-depth"
    format: "flag"
    default: 2
  - name: "exclude_sizes"
    type: "string"
    description: "过滤实测统一页响应大小，逗号分隔，例如 1234B,4KB；未建立稳定基线时省略"
    required: false
    flag: "--exclude-sizes"
    format: "flag"
  - name: "exclude_text"
    type: "string"
    description: "过滤包含实测统一页特征文本的响应；避免使用正常业务页也含有的通用文本"
    required: false
    flag: "--exclude-text"
    format: "flag"
  - name: "exclude_regex"
    type: "string"
    description: "过滤匹配实测统一页正文特征正则的响应；表达式须由基线得出，不猜过滤规则"
    required: false
    flag: "--exclude-regex"
    format: "flag"
  - name: "exclude_response"
    type: "string"
    description: "过滤与基准页面相似的响应；填已验证随机不存在页面的站内路径（如 __baseline_missing_7e3a），不是本地文件或任意外部 URL"
    required: false
    flag: "--exclude-response"
    format: "flag"
  - name: "proxy"
    type: "string"
    description: "HTTP 代理地址（来自 proxy_get 的本地 HTTP CONNECT，如 http://127.0.0.1:PORT）；目标限流/边缘挑战持续拦截时使用；不要改写为 socks5://"
    required: false
    flag: "--proxy"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      额外 dirsearch 选项，例如 --no-color；带空格的值需加引号。
      优先使用已定义参数；不要重复覆盖 threads/rate_limit/timeout/max_time/max_recursion_depth，或用 --deep-recursive/--force-recursive 扩大本轮范围。
      保留旧调用兼容，此字段不是预算强制隔离；具体选项先核对执行环境 dirsearch --help，不混用 ffuf 的 -mc/-ac/-fs。
    required: false
    format: "positional"
