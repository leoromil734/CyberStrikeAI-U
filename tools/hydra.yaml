name: "hydra"
command: "hydra"
args: ["-I"]
enabled: true
short_description: "密码暴力破解工具，支持多种协议和服务"
description: |
  Hydra 是网络登录口令爆破工具，支持 SSH、FTP、HTTP、SMB 等多种协议。

  **调用约定（必读）：**
  - 必须提供 **用户名**：`username`（-l）或 `username_file`（-L）至少其一
  - 必须提供 **口令**：`password`（-p）、`password_file`（-P）或 `-C`（经 `additional_args`）至少其一
  - 按 credential-stuffing 分档预算验证：轻量首轮每账号≤8、每入口≤5账号/40组合/5分钟（显式 `-t 1 -c 3 -W 3`）；高价值认证入口深度档每账号≤30、每入口≤10账号/300组合/20分钟（默认 `-t 4 -W 1`）。禁止全量 `-L` × `-P`、rockyou 或成功试跑后自动扩大；先核对有限候选对文件
  - 字典优先使用按已知信息生成的针对性字典（品牌名/人名/邮箱前缀/年份）：
    `python3 /opt/CyberStrikeAI-U/skills/credential-stuffing/scripts/wordlist_gen.py --base <品牌> --name <人名> --email-prefix <前缀> --domain <域名> --out <路径>`，
    保存输出行数与 SHA-256，按序在预算内递进使用
  - 默认启用：找到即停（-f）、并行 4（-t 4）、每线程连接间隔 1 秒（-W 1）、忽略 restore（-I）；`-c` 全局间隔会强制单线程，仅在需要更慢节奏时使用；仍须外部计时/取消保证总时限及命中/锁定/验证码/MFA/429/异常停止
  - 支持范围内 SSH、数据库及 SMTP/IMAP/POP3 等实际提供密码认证的服务；精简字典说明见 skills/credential-stuffing/references/lite-wordlists.md

  **CLI 顺序：** `hydra [选项] <target> <service>`（本工具已按此顺序组参，勿把 target 写在选项前）

  **使用场景：** 授权环境下的弱口令检测、密码强度评估

  **注意：** 仅用于已授权目标；对无响应目标请减小 `wait_time` 或缩小字典，避免长时间挂起。
parameters:
  - name: "username"
    type: "string"
    description: "单个用户名（-l）；与 username_file 二选一至少填一个"
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "用户名字典文件（-L）"
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "单个密码（-p）"
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "密码字典文件（-P）；优先使用按已知信息生成的针对性字典，其次通用档高价值子集"
    required: false
    flag: "-P"
    format: "flag"
  - name: "stop_on_first"
    type: "bool"
    description: "找到一对有效账密后立即退出（-f，默认 true）"
    required: false
    flag: "-f"
    format: "flag"
    default: true
  - name: "tasks"
    type: "int"
    description: "每目标并行连接数（-t）；深度档默认 4，轻量首轮显式传 1"
    required: false
    flag: "-t"
    format: "flag"
    default: 4
  - name: "attempt_interval"
    type: "int"
    description: "全局认证尝试间隔秒数（-c，强制单线程）；仅保守场景使用（如 3），深度档不填以保留并发"
    required: false
    flag: "-c"
    format: "flag"
  - name: "wait_time"
    type: "int"
    description: "单次连接等待响应秒数（-w），默认 16（低于 Hydra 默认 32，减少挂起感）"
    required: false
    flag: "-w"
    format: "flag"
    default: 16
  - name: "wait_between"
    type: "int"
    description: "每线程连接间隔秒数（-W）；深度档默认 1，轻量首轮显式传 3"
    required: false
    flag: "-W"
    format: "flag"
    default: 1
  - name: "output_file"
    type: "string"
    description: "将结果写入文件（-o），长任务建议指定"
    required: false
    flag: "-o"
    format: "flag"
  - name: "target"
    type: "string"
    description: "目标 IP、主机名或 CIDR（须在选项之后）"
    required: true
    position: 1
    format: "positional"
  - name: "service"
    type: "string"
    description: "服务类型（ssh、ftp、http-get、http-post-form、smb 等，见 hydra -h）"
    required: true
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "额外参数（如 -s 端口、-S SSL、-m 模块选项、-C login:pass 文件），追加在命令末尾"
    required: false
    format: "positional"
