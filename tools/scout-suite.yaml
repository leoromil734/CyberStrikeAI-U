name: "scout-suite"
command: "scout"
# 云审计主用 prowler（维护更活跃）。Scout Suite 保留作多云补充，默认关闭
enabled: false
short_description: "多云安全评估工具（次选，主用 prowler）"
description: |
  Scout Suite是一个多云安全评估工具，支持AWS、Azure、GCP、Aliyun和OCI。

  **状态：次选（默认关闭）**
  - 主用工具请改用 **prowler**（`tools/prowler.yaml`）
  - 需要 Aliyun/OCI 等 Scout 特长时再启用本工具

  **主要功能：**
  - 多云安全评估
  - 配置审计
  - 安全最佳实践检查
  - 详细报告生成

  **使用场景：**
  - 云安全审计
  - 合规性检查
  - 安全评估
  - 云配置审计
parameters:
  - name: "provider"
    type: "string"
    description: "云提供商（aws, azure, gcp, aliyun, oci）"
    required: false
    flag: "--provider"
    format: "flag"
    default: "aws"
  - name: "profile"
    type: "string"
    description: "AWS配置文件"
    required: false
    flag: "--profile"
    format: "flag"
    default: "default"
  - name: "report_dir"
    type: "string"
    description: "报告保存目录"
    required: false
    flag: "--report-dir"
    format: "flag"
    default: "/tmp/scout-suite"
  - name: "services"
    type: "string"
    description: "要评估的特定服务"
    required: false
    flag: "--services"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      额外的scout-suite参数。用于传递未在参数列表中定义的scout-suite选项。

      **示例值：**
      - 根据工具特性添加常用参数示例

      **注意事项：**
      - 多个参数用空格分隔
      - 确保参数格式正确，避免命令注入
      - 此参数会直接追加到命令末尾
    required: false
    format: "positional"
