name: "jsluice"
command: "/usr/local/bin/csai-jsluice"
enabled: true
short_description: "本地 JS 静态提取：URL/方法/参数候选与 tentative secrets，保留来源和 hash"
description: |
  默认 JS 静态分析工具。入口是项目提供的 scripts/recon/jsluice_runner.py 安装别名 csai-jsluice；依赖 BishopFox jsluice。
  仅分析已下载的本地 JavaScript，不爬取网页、不请求 source_url、不执行 JS、不验证端点。
  先使用 katana/gau 收集范围内 JS URL，按授权用 httpx/下载工具保存源码，再传 file 和 source_url。
  source_url 是实际源码来源元数据，不能用站点首页替代；保留抓取记录、文件和 SHA-256。
  原始 CLI 只使用已核对的 `jsluice urls --include-source -- FILE` / `jsluice secrets -- FILE`。
  上游 -j 是 raw-input，不是 JSON 开关；-p 是 secrets patterns，不是 pretty JSON。封装不接受 additional_args 或 URL 输入。
  mode=urls 逐行保留 url/relativeURL、method、type、queryParams/bodyParams；EXPR 拼接占位不改为已解析路径。
  相对路径不自动按 JS 所在目录拼接，需复核页面/baseURL/调用上下文。全部记录 candidate_only=true、verification=unverified。
  mode=secrets 的密钥值仅存在私有原件，候选导出只保留种类、来源与 hash，始终 tentative；不得直接 record_vulnerability。
  每轮托管于 $CSAI_ARTIFACT_DIR/jsluice/execution-$CSAI_EXECUTION_ID/：source.js、raw.jsonl、stderr.log、urls.jsonl 或 secrets.jsonl、manifest.json。
  stdout 只有状态/计数，不是 JSONL 原件。后端仅按执行绑定推导上述路径，拒绝 stdout 路径提示、跨执行、symlink/hardlink 和 hash 变化。
  complete 仅表示有界静态分析/导出结束，coverage_complete 始终 false；工具退出0但 stderr 有错误也标 partial。
  单文件≤32MiB、原件输出≤64MiB（进程监测上限）、每行≤1MiB、最多100000条、默认120秒；触边界留 gap/blocked。
  同批全部下载 JS/chunk/worker/source map 原源码仍需实际 grep/rg 复核，保留两路命令/hash/raw/unique/incremental。
  缺依赖记录 blocked 并使用离线替代解析，不把失败/零结果当作没有接口，也不自动回退在线 jsapiscan。
parameters:
  - name: "mode"
    type: "string"
    description: "urls 提取端点候选；secrets 提取 tentative 密钥样式。"
    required: false
    default: "urls"
    position: 0
    format: "positional"
    options: ["urls", "secrets"]
  - name: "file"
    type: "string"
    description: "已下载的本地 JS 文件，不接受 HTTP/HTTPS URL。"
    required: true
    existing_file: true
    flag: "--file"
    format: "flag"
  - name: "source_url"
    type: "string"
    description: "本地源码实际来源的 HTTP/HTTPS JS URL；仅作元数据，封装不会请求该 URL。"
    required: true
    flag: "--source-url"
    format: "flag"
  - name: "timeout_seconds"
    type: "int"
    description: "离线分析时限1–600秒，默认120；另需预留导出时间。"
    default: 120
    flag: "--timeout"
    format: "flag"
  - name: "validate_only"
    type: "bool"
    description: "仅离线校验本地文件、来源元数据和预算，不运行 jsluice、不访问网络。"
    default: false
    flag: "--validate-only"
    format: "flag"
