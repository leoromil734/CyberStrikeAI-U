name: "httpx"
command: "httpx-pd"
enabled: true

short_description: "ProjectDiscovery HTTP 探活与指纹工具；MCP 名 httpx，实际命令 httpx-pd"

description: |
  ProjectDiscovery httpx：对 URL/主机做高速 HTTP 探测与基础指纹。

  **主要功能：**
  - 批量探活（HTTP/HTTPS）
  - 状态码、标题、Content-Length、Web Server
  - 技术栈识别（`-td`）
  - 跟随重定向、自定义 Header、代理
  - JSON/静默输出，便于管道与后续 nuclei/ffuf

  **使用场景：**
  - 子域名/资产列表探活（常接在 subfinder、OneForAll 之后）
  - 筛选可扫目标再交给 nuclei / dalfox / ffuf
  - Bug bounty 与渗透信息收集

  **推荐链路：**
  - subfinder/oneforall → **httpx** → nuclei / katana / ffuf

  **注意事项：**
  - MCP 名仍为 `httpx`，实际执行安装器提供的 `httpx-pd`，从命令层规避 Python `httpx` 同名 CLI
  - 若提示 `httpx-pd` 不存在，重新运行 `install-tools-ubuntu24.sh`；不要退回 Python `httpx`
  - 大量目标时控制线程、速率与超时，避免对目标造成过大压力
  - 仅在授权范围内使用

parameters:
  - name: "target"
    type: "string"
    description: |
      单个目标 URL 或主机。

      **示例值：**
      - "https://example.com"
      - "example.com"
      - "http://192.168.1.10:8080"

      **注意事项：**
      - 与 `target_list` 二选一；同时提供时以本参数为准（`-u`）
    required: false
    flag: "-u"
    format: "flag"

  - name: "target_list"
    type: "string"
    description: |
      目标列表文件路径（每行一个 URL/主机）。

      **示例值：**
      - "/tmp/hosts.txt"
      - "subs.txt"

      **注意事项：**
      - 对应 `-l`；无 `target` 时使用
    required: false
    flag: "-l"
    format: "flag"

  - name: "silent"
    type: "bool"
    description: "静默模式，只输出结果行"
    required: false
    default: true
    flag: "-silent"
    format: "flag"

  - name: "status_code"
    type: "bool"
    description: "显示 HTTP 状态码"
    required: false
    default: true
    flag: "-sc"
    format: "flag"

  - name: "title"
    type: "bool"
    description: "显示页面标题"
    required: false
    default: true
    flag: "-title"
    format: "flag"

  - name: "tech_detect"
    type: "bool"
    description: "启用技术栈识别；侦察默认开启，直接为组件漏洞检索提供线索"
    required: false
    default: true
    flag: "-td"
    format: "flag"

  - name: "cdn_detect"
    type: "bool"
    description: "识别 CDN/WAF；仅用于标注边缘，不代表已确认 TLS 指纹拦截"
    required: false
    default: true
    flag: "-cdn"
    format: "flag"

  - name: "web_server"
    type: "bool"
    description: "显示 Web Server 指纹"
    required: false
    default: true
    flag: "-server"
    format: "flag"

  - name: "content_length"
    type: "bool"
    description: "显示 Content-Length，便于识别 catch-all 与响应差分"
    required: false
    default: true
    flag: "-cl"
    format: "flag"

  - name: "ip"
    type: "bool"
    description: "显示解析 IP，便于资产归并与 CDN 判断"
    required: false
    default: false
    flag: "-ip"
    format: "flag"

  - name: "follow_redirects"
    type: "bool"
    description: "跟随重定向"
    required: false
    default: false
    flag: "-fr"
    format: "flag"

  - name: "json_output"
    type: "bool"
    description: "JSON 行输出（便于解析）"
    required: false
    default: false
    flag: "-json"
    format: "flag"

  - name: "threads"
    type: "int"
    description: "并发线程数；先小批量基线，再按目标规模提高"
    required: false
    default: 30
    flag: "-t"
    format: "flag"

  - name: "rate_limit"
    type: "int"
    description: "每秒最大请求数，避免因高频触发 WAF/限流后污染探活结论"
    required: false
    default: 100
    flag: "-rl"
    format: "flag"

  - name: "timeout"
    type: "int"
    description: "单请求超时（秒）"
    required: false
    default: 10
    flag: "-timeout"
    format: "flag"

  - name: "additional_args"
    type: "string"
    description: |
      额外的 httpx 参数，多个用空格分隔。

      **示例值：**
      - "-server -cl -ip"
      - "-H 'User-Agent: Mozilla/5.0' -x http://127.0.0.1:8080"
      - "-mc 200,301,302 -fc 404"

      **注意事项：**
      - 直接追加到命令末尾，注意注入与引号
    required: false
    format: "positional"