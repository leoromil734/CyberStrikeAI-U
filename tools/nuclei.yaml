name: "nuclei"
command: "nuclei"
enabled: true
short_description: "基于YAML模板的快速漏洞扫描器（替代 jaeles）"
description: |
  Nuclei是一个基于模板的快速漏洞扫描器，使用社区维护的YAML模板进行漏洞检测。

  **定位：** 模板化漏洞扫描的**主用工具**（替代已弃用的 jaeles）。
  **推荐链路：** httpx 探活后 → nuclei。

  **输出契约：** 默认 `-jsonl -silent`，stdout 为原生 JSONL（一行一条发现），诊断与人类日志留在 stderr。
  人类可读摘要由展示层生成。空 stdout 可以表示零发现，不是 JSON 解码失败，也不能单凭空输出认定扫描完整。
  未到平台单次工具时限前不要取消。静默数分钟不是卡住；中途取消的空结果不是零发现。
  显式 `json_output=false` 保留原生文本输出，解析层必须据实际参数/原件标为 text；不会将文本伪装成 JSONL。

  **主要功能：**
  - 快速漏洞扫描
  - 基于模板的检测
  - 支持多种协议（HTTP, TCP, DNS等）
  - 实时结果输出
  - 支持自定义模板

  **使用场景：**
  - 漏洞扫描和发现
  - 安全评估
  - 渗透测试
  - 漏洞验证
parameters:
  - name: "target"
    type: "string"
    description: "目标URL或IP"
    required: true
    flag: "-u"
    format: "flag"
  - name: "severity"
    type: "string"
    description: "严重程度过滤（critical,high,medium,low,info）"
    required: false
    flag: "-s"
    format: "flag"
  - name: "tags"
    type: "string"
    description: "标签过滤（如cve,rce,lfi）"
    required: false
    flag: "-tags"
    format: "flag"
  - name: "template"
    type: "string"
    description: "自定义模板路径"
    required: false
    flag: "-t"
    format: "flag"
  - name: "json_output"
    type: "bool"
    description: "原生 JSONL 输出（-jsonl），默认开启。显式 false 关闭；使用 additional_args 自定义输出模式时先关闭本参数。-json-export/-jsonl-export 仅导出文件，不代表 stdout 的格式。"
    required: false
    default: true
    flag: "-jsonl"
    format: "flag"
  - name: "silent"
    type: "bool"
    description: "只输出发现，默认开启；可显式 false 保留进度诊断。stderr 不属于 JSONL 数据流。"
    required: false
    default: true
    flag: "-silent"
    format: "flag"
  - name: "proxy"
    type: "string"
    description: "HTTP 代理地址（来自 proxy_get 的本地 HTTP CONNECT，如 http://127.0.0.1:PORT）；目标限流/边缘挑战持续拦截时使用；不要改写为 socks5://"
    required: false
    flag: "-proxy"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "额外的Nuclei参数"
    required: false
    format: "positional"
