name: "gobuster"
command: "gobuster"
# 已由 dirsearch（目录/文件）与 ffuf（模糊测试）替代。需要时改回 enabled: true
enabled: false
short_description: "Web内容扫描工具（已弃用；目录用 dirsearch，模糊测试用 ffuf）"
description: |
  Gobuster是一个快速的内容发现工具，用于Web应用程序的目录、文件和子域名枚举。

  **状态：已弃用（默认关闭）**
  - 目录/文件枚举优先 **dirsearch**（`tools/dirsearch.yaml`）；参数、虚拟主机和自定义请求模糊测试优先 **ffuf**（`tools/ffuf.yaml`）
  - 本配置保留仅作兼容，不建议新任务调用

  **主要功能：**
  - 目录和文件发现
  - DNS子域名枚举
  - 虚拟主机发现
  - 支持多种模式（dir, dns, fuzz, vhost）

  **使用场景：**
  - Web应用安全测试
  - 目录枚举和文件发现
  - 子域名发现
  - 渗透测试信息收集
parameters:
  - name: "mode"
    type: "string"
    description: |
      扫描模式（Gobuster子命令），对应以下取值：
      - `dir`: 目录/文件枚举
      - `dns`: DNS子域名枚举
      - `fuzz`: 模板FUZZ扫描
      - `vhost`: 虚拟主机发现

      **注意：**
      Gobuster要求第一个参数为模式子命令，因此这里作为位置参数传递。
    required: false
    default: "dir"
    position: 0
    format: "positional"
    options: ["dir", "dns", "fuzz", "vhost"]
  - name: "url"
    type: "string"
    description: "目标URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "字典文件路径；建议省略，执行器按候选路径选择第一个真实存在的文件"
    required: false
    existing_file: true
    default: "/opt/cyberstrike/wordlists/raft-small-directories.txt"
    fallback_paths:
      - "/opt/cyberstrike/wordlists/raft-small-directories.txt"
      - "/opt/cyberstrike/wordlists/raft-medium-directories.txt"
      - "/opt/pipx/venvs/dirsearch/lib/python3.10/site-packages/dirsearch/db/dicc.txt"
      - "/usr/share/seclists/Discovery/Web-Content/raft-small-directories.txt"
      - "/usr/share/wordlists/dirb/common.txt"
    flag: "-w"
    format: "flag"
  - name: "proxy"
    type: "string"
    description: "HTTP 代理地址（来自 proxy_get 的本地 HTTP CONNECT，如 http://127.0.0.1:PORT）；目标限流/边缘挑战持续拦截时使用；不要改写为 socks5://"
    required: false
    flag: "--proxy"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "额外的Gobuster参数"
    required: false
    format: "positional"
