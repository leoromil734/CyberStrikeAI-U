name: "oneforall"
command: "oneforall"
enabled: true

short_description: "根域深度子域增量收集；subfinder 首轮后按深度门控调用，补齐异构数据源"

description: |
  OneForAll（shmilylty/OneForAll）是子域名收集框架，整合多种被动数据源与主动爆破。

  **主要功能：**
  - 多接口被动收集（证书透明度、搜索引擎、DNS 数据集等）
  - 子域爆破、解析校验、存活探测（依赖其内置模块）
  - 结果导出（csv/json 等，视版本与参数）

  **使用场景与触发条件：**
  - 根域深度侦察：subfinder 快速轮之后，调用一次 OneForAll 补齐异构数据源
  - subfinder 结果很少、目标价值高、或用户要求完整攻击面时必须调用
  - 单 URL/IP、通配 DNS 已确认、快速探活任务或上游明确禁止全量枚举时跳过，并记录原因
  - 与 subfinder/amass 结果去重后交给 dnsx/httpx，不重复扫描相同主机

  **推荐链路：**
  - subfinder（快）→ **oneforall**（深度补齐，默认关闭爆破/HTTP探测）→ dnsx → httpx

  **与 subfinder 的关系：**
  - subfinder：轻量、偏被动 API，适合首轮快速反馈
  - oneforall：数据源更多但更重，适合作为第二阶段增量收集
  - 正常根域深度侦察应各执行一次，而不是长期只使用 subfinder

  **CLI 形态：**
  - 等价：`oneforall --target example.com run`
  - 参数映射：flag 在前，`run` 作为末尾位置参数（position≥1）

  **注意事项：**
  - 首次运行会拉依赖/数据，耗时较长
  - 部分数据源需自行配置 API Key（安装目录 `/opt/OneForAll` 内 config）
  - 仅在授权范围内使用；主动爆破可能产生大量 DNS 查询

parameters:
  - name: "target"
    type: "string"
    description: |
      目标主域名（不要带协议）。

      **示例值：**
      - "example.com"

      **注意事项：**
      - 对应 `--target`
    required: true
    flag: "--target"
    format: "flag"

  - name: "fmt"
    type: "string"
    description: |
      导出格式（若当前版本支持 `--fmt`）。

      **示例值：**
      - "csv"
      - "json"
    required: false
    flag: "--fmt"
    format: "flag"

  - name: "path"
    type: "string"
    description: |
      结果导出路径（若当前版本支持 `--path`）。

      **示例值：**
      - "/tmp/oneforall_results"
    required: false
    flag: "--path"
    format: "flag"

  - name: "action"
    type: "string"
    description: |
      子命令，放在所有 flag 之后。完整收集使用 `run`。

      **示例值：**
      - "run"

      **注意事项：**
      - 必须用 position≥1，避免变成 `oneforall run --target ...`（上游不接受）
    required: false
    default: "run"
    position: 1
    format: "positional"

  - name: "additional_args"
    type: "string"
    description: |
      额外 OneForAll 参数，多个用空格分隔（追加在命令末尾）。

      **示例值：**
      - "--brute True"
      - "--dns True --req True"

      **注意事项：**
      - 参数名随 OneForAll 版本可能变化，以 `oneforall --help` 为准
      - 若与 `action` 冲突，优先保证 `run` 仍在合理位置
    required: false
    format: "positional"