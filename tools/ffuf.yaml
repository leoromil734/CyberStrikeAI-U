name: "ffuf"
command: "ffuf"
enabled: true
short_description: "参数、虚拟主机和自定义请求模糊测试首选；目录发现优先 dirsearch，可复用等价扫描证据"
description: |
  FFuf是一个快速的Web模糊测试工具，用于目录发现、参数模糊测试和内容发现。

  **定位：** 参数、虚拟主机和自定义请求模糊测试的首选工具；目录、文件和扩展名枚举优先 dirsearch。需要自定义请求/过滤或 dirsearch 不可用时，可承担等价的有界目录扫描；同范围已有充分且仍有效的扫描证据可复用，不为调用次数重复扫描。

  **主要功能：**
  - 快速目录和文件发现
  - 参数模糊测试
  - 虚拟主机发现
  - 自定义过滤器和匹配器
  - 多线程支持

  **使用场景：**
  - Web应用安全测试
  - 目录枚举
  - 参数发现
  - 内容发现

  **执行纪律：**
  - 先用 2–3 个随机路径建立 catch-all 基线，再运行 ffuf
  - 默认启用自动校准并匹配全部状态码，避免漏掉 405/500 等高价值差分
  - 优先小字典快速覆盖；只有发现技术栈、命名规律或高价值入口后才升级大字典
  - 仅作为目录发现替代时可省略 wordlist，执行器自动选择已有路径字典；参数/虚拟主机/自定义请求任务必须传入真实且适配该维度的字典，收到字典回退提示后须确认语义，不能把目录字典结果当参数覆盖
  - 单次扫描默认最多 300 秒；显式设定范围、候选集与速率，超时/限流/中断未完成留 gap/blocked，不按进程成功或零新增宣称全覆盖
parameters:
  - name: "url"
    type: "string"
    description: "目标 URL；按任务在 URL、Header 或请求体中设置 FUZZ 占位符"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "任务维度对应的真实字典路径；仅目录扫描可省略并自动选路径字典。参数/虚拟主机/自定义请求需显式传入适配字典；无效路径回退时必须核对语义"
    required: false
    existing_file: true
    fallback_paths:
      - "/opt/cyberstrike/wordlists/raft-small-directories.txt"
      - "/opt/cyberstrike/wordlists/raft-medium-directories.txt"
      - "/usr/share/seclists/Discovery/Web-Content/raft-small-directories.txt"
      - "/usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt"
      - "/opt/pipx/venvs/dirsearch/lib/python3.10/site-packages/dirsearch/db/dicc.txt"
      - "/usr/share/wordlists/dirb/common.txt"
      - "/usr/share/wordlists/dirbuster/directory-list-2.3-small.txt"
    flag: "-w"
    format: "flag"
  - name: "match_codes"
    type: "string"
    description: "匹配的HTTP状态码；默认 all，配合自动校准/过滤器保留异常差分"
    required: false
    default: "all"
    flag: "-mc"
    format: "flag"
  - name: "auto_calibration"
    type: "bool"
    description: "自动识别并过滤 catch-all 响应"
    required: false
    default: true
    flag: "-ac"
    format: "flag"
  - name: "noninteractive"
    type: "bool"
    description: "禁用交互控制台，适合 MCP 执行"
    required: false
    default: true
    flag: "-noninteractive"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "并发线程数；默认保守，确认未限流后再提高"
    required: false
    default: 20
    flag: "-t"
    format: "flag"
  - name: "rate_limit"
    type: "int"
    description: "每秒最大请求数"
    required: false
    default: 80
    flag: "-rate"
    format: "flag"
  - name: "timeout"
    type: "int"
    description: "单请求超时（秒）"
    required: false
    default: 10
    flag: "-timeout"
    format: "flag"
  - name: "max_time"
    type: "int"
    description: "单次扫描总时限（秒）；默认 300，必须为正数；超时未完成不能写全覆盖"
    required: false
    minimum: 1
    default: 300
    flag: "-maxtime"
    format: "flag"
  - name: "filter_size"
    type: "string"
    description: "过滤响应大小；已测得稳定 catch-all 大小时使用"
    required: false
    flag: "-fs"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "额外的FFuf参数"
    required: false
    format: "positional"
